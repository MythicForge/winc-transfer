[package]
name = "winc-ui"
version = "0.10.0"
description = "WINCI front end — Leptos (CSR, wasm) rendered in the Tauri webview"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Navigator",
    "Clipboard",
    "Performance",
    "KeyboardEvent",
    "PointerEvent",
    "Event",
    "EventTarget",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

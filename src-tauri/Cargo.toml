[package]
name = "winc"
version = "0.9.2"
description = "WINC — direct-cable PC data crossing"
authors = ["you"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# the `log` facade only — records are fanned out by our own logbus.rs (ring
# buffer + winc://log event + rotating file), which tauri-plugin-log can't do
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"

# transfer engine
rand = "0.8"
walkdir = "2.5"
dirs = "5.0"
if-addrs = "0.13"

# encrypted transport (SPAKE2 + AEAD)
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# adapter hardware descriptions (Thunderbolt/USB4 detection) — if-addrs only
# exposes the friendly name ("Ethernet 3")
ipconfig = "0.3"
